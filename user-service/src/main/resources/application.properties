server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/reserva_salas_user?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForJWTThatIsAtLeast256BitsLongForHS256Algorithm12345}
jwt.expiration.seconds=3600
jwt.preauth.expiration.seconds=300

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:configure-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:configure-me}
spring.security.oauth2.client.registration.google.scope=email,profile

# URL do frontend para redirect pós OAuth2
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Chave AES-256 para criptografia do totp_secret (mínimo 32 chars)
totp.encryption.key=${TOTP_ENCRYPTION_KEY:ThisIsA32CharKeyForTotpAES256Enc}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
