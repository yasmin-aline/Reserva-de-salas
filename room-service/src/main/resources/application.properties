server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/reserva_salas_room?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (mesmo segredo do user-service)
jwt.secret=${JWT_SECRET:mySecretKeyForJWTThatIsAtLeast256BitsLongForHS256Algorithm12345}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
